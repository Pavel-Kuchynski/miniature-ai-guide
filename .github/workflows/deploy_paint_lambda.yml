name: Deploy Paint Lambda

# Interim (non-CDK) deploy pipeline: packages backend/paint source into a
# zip and pushes it directly to the already-existing "paint" Lambda function
# via `aws lambda update-function-code`. The function, its S3 bucket, DynamoDB table, SQS queue,
# and IAM execution role were created manually in the AWS Console. This workflow does not
# provision or modify any infrastructure.
#
# Prerequisites that must exist in AWS/GitHub before this workflow can succeed:
#   - An IAM OIDC identity provider for token.actions.githubusercontent.com
#   - A "GitHub Actions deploy" IAM role trusting that provider (scoped to this repo),
#     with permission to call lambda:UpdateFunctionCode on the paint function
#   - Repo variables: vars.AWS_DEPLOY_ROLE_ARN, vars.AWS_REGION, vars.PAINT_FUNCTION_NAME
#   - AWS Lambda function: "paint"
#     - Handler: handler.lambda_handler
#     - Environment variables: UPLOAD_BUCKET_NAME, PAINT_BUCKET_NAME, STATIC_BUCKET_NAME, JOBS_TABLE_NAME, GUIDE_CREATION_QUEUE_URL,
#   - S3 bucket: referenced by UPLOAD_BUCKET_NAME env var
#   - DynamoDB table: referenced by JOBS_TABLE_NAME env var
#   - SQS queue: referenced by GUIDE_CREATION_QUEUE_URL env var

on:
  push:
    branches:
      - main
    paths:
      - "backend/paint/**"
      - ".github/workflows/deploy_paint_lambda.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  LAMBDA_FUNCTION_NAME: ${{ vars.PAINT_FUNCTION_NAME }}

jobs:
  test:
    name: Run unit tests (pre-deploy gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/paint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: backend/paint
        run: pytest -v

  deploy:
    name: Package and deploy to AWS Lambda
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must match the Lambda runtime (python3.12). pydantic_core ships CPython-specific
      # compiled wheels, so the packaging Python has to be the runtime's version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda source
        working-directory: backend/paint
        run: |
          mkdir -p /tmp/lambda-package
          rsync -a --exclude 'tests' --exclude 'README.md' --exclude '__pycache__' \
            --exclude 'requirements.txt' --exclude 'requirements-dev.txt' \
            --exclude '*.pyc' --exclude '.pytest_cache' \
            ./ /tmp/lambda-package/
          cd /tmp/lambda-package
          # Install wheels for the Lambda target (linux x86_64, CPython 3.12), not the runner's platform.
          pip install -r "${GITHUB_WORKSPACE}/backend/paint/requirements.txt" -t . \
            --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 \
            --only-binary=:all: --upgrade
          zip -r "${GITHUB_WORKSPACE}/paint.zip" .

      # Fail fast if a compiled extension for the target is missing
      # (the cause of "cannot import name 'ArgsKwargs' from 'pydantic_core._pydantic_core'").
      - name: Verify compiled dependencies for Lambda target
        run: |
          test -f /tmp/lambda-package/pydantic_core/_pydantic_core.cpython-312-x86_64-linux-gnu.so \
            || { echo "::error::pydantic_core cp312 x86_64 extension missing from package"; exit 1; }
          test -f /tmp/lambda-package/PIL/_imaging.cpython-312-x86_64-linux-gnu.so \
            || { echo "::error::Pillow cp312 x86_64 extension missing from package"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy code to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://paint.zip

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"
